name: Validate BlockForge

on:
  push:
    branches: [main, v2-development]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate single-file editor
        run: node scripts/check-html.mjs
